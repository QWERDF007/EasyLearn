<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body>
    <main class="app-shell no-document">
      <aside class="sidebar" aria-label="文档导航">
        <div class="brand-row">
          <div class="brand">EasyLearn</div>
          <span class="brand-mark" aria-hidden="true">EL</span>
        </div>
        <form id="upload-form" class="upload-form">
          <label class="upload-button">
            <span aria-hidden="true">＋</span>
            <span>上传文档</span>
            <input id="file-input" type="file" accept=".pdf,.png,.jpg,.jpeg,.jp2,.webp,.gif,.bmp,.tif,.tiff,.docx,.pptx,.xlsx" required>
          </label>
        </form>
        <div class="sidebar-heading">文档</div>
        <nav id="document-list" class="document-list" aria-live="polite"></nav>
        <div class="sidebar-heading">任务</div>
        <div id="task-list" class="task-list" aria-live="polite"></div>
      </aside>

      <section class="reader-column">
        <header class="topbar">
          <div class="document-identity">
            <h1 id="document-name">选择一个文档</h1>
            <p id="document-status" class="muted">上传后开始解析</p>
          </div>
        </header>
        <div id="parse-progress" class="parse-progress" hidden aria-live="polite">
          <div class="progress-heading">
            <div>
              <span id="parse-progress-title" class="progress-title">解析中</span>
              <span id="parse-progress-message" class="muted">等待执行</span>
            </div>
            <span id="parse-progress-percent" class="progress-percent"></span>
          </div>
          <div class="progress-track"><span id="parse-progress-bar"></span></div>
          <div class="progress-footer">
            <span id="parse-progress-elapsed" class="muted">已用时 0 秒</span>
            <button id="parse-progress-cancel" class="text-icon-button" type="button" title="取消解析" aria-label="取消解析"><span aria-hidden="true">×</span> 取消</button>
          </div>
        </div>
        <div id="empty-upload-state" class="empty-upload-state" role="status">
          <label id="empty-upload-dropzone" class="empty-upload-dropzone" for="file-input">
            <span class="empty-upload-icon" aria-hidden="true">↑</span>
            <strong>点击上传或者拖入文件开始解析</strong>
            <span>支持 PDF/PNG/JPG/BMP/TIFF 等各种图片格式</span>
            <span>单文件 ≤ 200MB · 单张图片 ≤ 10MB</span>
          </label>
        </div>
        <div id="pdf-viewer" class="pdf-viewer" aria-label="PDF 原文" tabindex="0" hidden>
          <div id="pdf-pages" class="pdf-pages"></div>
          <div id="pdf-toolbar" class="pdf-toolbar" aria-label="PDF 阅读控制">
            <button id="prev-page" class="icon-button reader-icon" type="button" aria-label="上一页" title="上一页" disabled><span aria-hidden="true">‹</span></button>
            <span id="page-count" class="page-count" aria-live="polite">0 / 0</span>
            <button id="next-page" class="icon-button reader-icon" type="button" aria-label="下一页" title="下一页" disabled><span aria-hidden="true">›</span></button>
            <span class="toolbar-divider" aria-hidden="true"></span>
            <label class="zoom-control" title="缩放比例">
              <span class="sr-only">缩放比例</span>
              <select id="zoom-select" aria-label="缩放比例" disabled>
                <option value="0.5">50%</option>
                <option value="0.75">75%</option>
                <option value="1" selected>100%</option>
                <option value="1.5">150%</option>
                <option value="2">200%</option>
                <option value="">自定义</option>
              </select>
            </label>
            <button id="reset-zoom" class="icon-button reader-icon" type="button" aria-label="重置缩放" title="重置缩放" disabled><span aria-hidden="true">1:1</span></button>
            <button id="fit-width" class="icon-button reader-icon" type="button" aria-label="适应宽度" title="适应宽度" disabled><span aria-hidden="true">↔</span></button>
            <button id="rotate-page" class="icon-button reader-icon" type="button" aria-label="旋转页面" title="旋转页面" disabled><span aria-hidden="true">⟳</span></button>
          </div>
        </div>
      </section>

      <section class="result-column">
        <header class="result-header">
          <div class="result-header-main">
            <div class="tabs" role="tablist" aria-label="结果视图">
              <button class="tab result-tab is-active" data-view="zh" type="button">中文 Markdown</button>
              <button class="tab result-tab" data-view="source" type="button">原文 Markdown</button>
              <button id="bilingual-tab" class="tab result-tab" data-view="bilingual" type="button">中英对照</button>
              <button class="tab result-tab" data-view="json" type="button">JSON</button>
              <button id="source-markdown-tab" class="tab result-tab" data-view="raw" type="button">源码</button>
            </div>
            <div class="result-actions">
              <button id="settings-button" class="icon-button toolbar-icon" type="button" title="设置" aria-label="设置" aria-expanded="false" aria-controls="settings-panel" disabled><span aria-hidden="true">⚙</span></button>
              <button id="reparse-button" class="icon-button toolbar-icon" type="button" title="重新解析" aria-label="重新解析" disabled><span aria-hidden="true">↻</span></button>
              <button id="download-button" class="icon-button toolbar-icon" type="button" title="下载解析结果" aria-label="下载解析结果" disabled><span aria-hidden="true">⇩</span></button>
              <span class="result-action-divider" aria-hidden="true"></span>
              <button id="translate-button" class="icon-button toolbar-icon" type="button" aria-label="翻译全文" title="翻译全文" disabled><span aria-hidden="true">文</span></button>
              <button id="qa-button" class="icon-button toolbar-icon" type="button" aria-label="AI 解读" title="AI 解读" disabled><span aria-hidden="true">✦</span></button>
              <button id="favorite-button" class="icon-button toolbar-icon" type="button" aria-label="收藏" title="收藏" disabled><span aria-hidden="true">☆</span></button>
              <button id="delete-button" class="icon-button toolbar-icon danger-icon" type="button" aria-label="删除文档" title="删除文档" disabled><span aria-hidden="true">⌫</span></button>
              <button id="search-toggle" class="icon-button small-icon" type="button" title="查找" aria-label="查找" aria-expanded="false"><span aria-hidden="true">⌕</span></button>
              <span id="selection-count" class="muted"></span>
            </div>
          </div>
          <div id="settings-panel" class="settings-panel" hidden>
            <label class="select-control version-control">
              <span>解析版本</span>
              <select id="version-select" aria-label="解析版本" disabled></select>
            </label>
            <label class="settings-switch" title="解析完成后自动翻译">
              <span>解析后自动翻译</span>
              <span id="auto-translate-option" class="switch-control">
                <input id="auto-translate" type="checkbox">
                <span aria-hidden="true"></span>
              </span>
            </label>
            <details id="office-options" class="office-options" hidden>
              <summary title="Office 预览选项">Office 预览选项</summary>
              <label>工作表 <input id="office-sheet" maxlength="255" placeholder="当前工作表"></label>
              <label>打印范围 <input id="office-print-range" maxlength="100" placeholder="A1:D20"></label>
            </details>
          </div>
          <div id="result-search" class="result-search" hidden>
            <label for="result-search-input">查找</label>
            <input id="result-search-input" type="search" maxlength="200" placeholder="查找原文或译文">
            <span id="result-search-count" class="muted"></span>
            <button id="clear-selection" class="icon-button small-icon" type="button" title="清除选择" aria-label="清除选择"><span aria-hidden="true">⊘</span></button>
          </div>
        </header>
        <div id="result-content" class="result-content" aria-live="polite"></div>
      </section>
    </main>

    <dialog id="qa-dialog" class="qa-dialog">
      <form id="qa-form">
        <div class="dialog-heading">
          <h2>AI 解读</h2>
          <button id="close-qa-button" type="button" class="icon-button" aria-label="关闭">×</button>
        </div>
        <p id="qa-anchor" class="muted">当前未选择块，将根据问题查找相关内容。</p>
        <div class="qa-history-row">
          <label for="qa-history-select">历史提问</label>
          <select id="qa-history-select" disabled>
            <option value="">暂无历史提问</option>
          </select>
          <button id="delete-qa-button" type="button" hidden>删除记录</button>
        </div>
        <div class="qa-options">
          <label class="check-control"><input id="qa-auto-related" type="checkbox" checked> 自动关联相关块</label>
          <label class="field-control">手动加入块 ID
            <input id="qa-related-blocks" maxlength="2000" placeholder="可用逗号分隔"></label>
          <label class="field-control">排除块 ID
            <input id="qa-exclude-blocks" maxlength="2000" placeholder="可用逗号分隔"></label>
        </div>
        <textarea id="question-input" rows="4" maxlength="4000" placeholder="针对当前文档提问"></textarea>
        <div class="dialog-actions">
          <button id="ask-button" type="submit">提问</button>
          <button id="stop-answer-button" type="button" hidden>停止</button>
        </div>
        <article id="answer-content" class="answer-content"></article>
        <div id="citation-list" class="citation-list"></div>
      </form>
    </dialog>

    <dialog id="document-delete-dialog" class="confirm-dialog">
      <form method="dialog" id="document-delete-form">
        <div class="dialog-heading">
          <h2>删除文档</h2>
          <button id="close-delete-button" type="button" class="icon-button" aria-label="关闭" title="关闭"><span aria-hidden="true">×</span></button>
        </div>
        <p id="delete-confirm-message" class="muted"></p>
        <div class="dialog-actions">
          <button id="cancel-delete-button" type="button" class="secondary-button">取消</button>
          <button id="confirm-delete-button" type="submit" class="danger-button">删除</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
