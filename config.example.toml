# EasyLearn v3 配置。字段定义与默认值的唯一来源是 src/easylearn/config.py。
# MinerU、LLM 和 Office 是外部能力；本配置不会安装或启动它们。

[app]
host = "127.0.0.1"
port = 8765
data_dir = "./data"
open_browser = false

[tasks]
queue_limit = 8
parse_concurrency = 1
translation_requests = 1
qa_requests = 1
finished_task_retention_minutes = 30

[cache]
max_mb = 128
max_documents = 3

[mineru]
mode = "cli"
command = ["mineru"]
timeout_seconds = 900
poll_interval_seconds = 1
# API 模式示例：mode = "api"，并填写 base_url；密钥使用 api_key_env 指向环境变量。
# base_url = "http://127.0.0.1:8001"
# api_key_env = "EASYLEARN_MINERU_API_KEY"

[mineru.parse]
backend = "vlm-engine"
language = "ch"
parse_method = "auto"
effort = "medium"
formula_enable = true
table_enable = true
image_analysis = false

[mineru.archive_limits]
max_archive_bytes = 536870912
max_expanded_bytes = 2147483648
max_member_bytes = 536870912
max_json_bytes = 33554432
max_members = 10000

[mineru.table_limits]
max_rows = 10000
max_columns = 1000
max_cells = 100000
max_markup_chars = 10485760

[mineru.image_limits]
max_pixels = 40000000
max_frames = 100
max_total_pixels = 80000000
max_svg_bytes = 8388608
max_svg_elements = 10000

[mineru.preview_limits]
max_pages = 2000
max_page_points = 14400
render_edge_pixels = 1024

[llm]
base_url = "http://127.0.0.1:8000/v1"
model = ""
# 填写推理服务实际提供的模型名后才会启用翻译/问答。
# api_key_env = "EASYLEARN_LLM_API_KEY"
timeout_seconds = 600
local_only = true
json_mode = false

[files]
max_upload_mb = 100
keep_parse_versions = 2
revision_history_limit = 10
tmp_retention_hours = 24
export_retention_days = 30
log_max_mb = 10
log_backup_count = 3

[extensions]
office_enabled = false
qa_enabled = false
semantic_search_enabled = false
office_command = ["soffice"]
qa_context_chars = 12000
qa_max_blocks = 64
