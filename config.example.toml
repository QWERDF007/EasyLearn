# EasyLearn v3 配置。字段定义与默认值的唯一来源是 src/easylearn/config.py。
# MinerU 使用仓库内置源码与本地模型；LLM 和 Office 是可选外部能力。

[app]
host = "127.0.0.1"
port = 8765
data_dir = "./data"
open_browser = false

[tasks]
queue_limit = 8
parse_concurrency = 1
translation_requests = 1
qa_requests = 1
finished_task_retention_minutes = 30

[cache]
max_mb = 128
max_documents = 3

[mineru]
default_model_id = "MinerU2.5-Pro-2605-1.2B"
# 模型候选必须显式登记；前端不提供模型选择，解析默认使用 default_model_id。
[[mineru.models]]
model_id = "MinerU2.5-Pro-2605-1.2B"
name = "MinerU2.5-Pro-2605-1.2B"
path = "F:/models/MinerU2.5-Pro-2605-1.2B"
timeout_seconds = 900

[mineru.parse]
backend = "vlm-engine"
language = "ch"
parse_method = "auto"
effort = "medium"
formula_enable = true
table_enable = true
image_analysis = false

[mineru.archive_limits]
max_archive_bytes = 536870912
max_expanded_bytes = 2147483648
max_member_bytes = 536870912
max_json_bytes = 33554432
max_members = 10000

[mineru.table_limits]
max_rows = 10000
max_columns = 1000
max_cells = 100000
max_markup_chars = 10485760

[mineru.image_limits]
max_pixels = 40000000
max_frames = 100
max_total_pixels = 80000000
max_svg_bytes = 8388608
max_svg_elements = 10000

[mineru.preview_limits]
max_pages = 2000
max_page_points = 14400
render_edge_pixels = 1024

[llm]
base_url = "http://127.0.0.1:8000/v1"
model = ""
# 填写推理服务实际提供的模型名后才会启用翻译/问答。
# api_key_env = "EASYLEARN_LLM_API_KEY"
timeout_seconds = 600
local_only = true
json_mode = false

[files]
max_upload_mb = 100
keep_parse_versions = 2
revision_history_limit = 10
tmp_dir = "F:/tmp"
tmp_retention_hours = 24
export_retention_days = 30
log_dir = "./logs"

[extensions]
office_enabled = false
qa_enabled = false
semantic_search_enabled = false
office_command = ["soffice"]
qa_context_chars = 12000
qa_max_blocks = 64
