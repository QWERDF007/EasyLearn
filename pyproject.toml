[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "easylearn"
version = "0.1.0"
description = "A lightweight local document parsing, translation and reading workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "uvicorn==0.52.4",
  "httpx==0.28.1",
  "aiosqlite==0.22.1",
  "filelock==3.20.3",
  "jinja2==3.1.6",
  "python-multipart==0.0.32",
  "pypdfium2==5.10.1",
  "pypdf==6.16.2",
  "pillow==12.1.1",
  "beautifulsoup4==4.15.0",
  "mineru-vl-utils[transformers]==1.2.1",
  "loguru==0.7.3",
  "opencv-python==4.13.0.92",
  "packaging==26.0",
  "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "pytest-asyncio==1.4.0", "ruff==0.16.5", "mypy==1.20.2"]
browser = ["selenium==4.48.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --import-mode=importlib"
markers = ["browser: end-to-end tests driven by Selenium and ChromeDriver"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
