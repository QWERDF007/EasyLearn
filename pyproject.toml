[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "easylearn"
version = "0.1.0"
description = "Versioned document parsing, translation and evidence workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "uvicorn==0.52.4",
  "httpx==0.28.1",
  "sqlalchemy==2.0.52",
  "alembic==1.19.2",
  "psycopg[binary]==3.3.5",
  "asyncpg==0.31.0",
  "redis==7.4.1",
  "dramatiq==2.2.0",
  "python-multipart==0.0.32",
  "pypdfium2==5.10.1",
  "pillow==12.1.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "pytest-asyncio==1.4.0", "ruff==0.16.5", "mypy==1.20.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
